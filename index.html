<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>داش بورد استديو التصوير</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="aperture" aria-hidden="true"></span>
        <h1>استديو التصوير <span>لوحة التحكم</span></h1>
      </div>
      <button id="logout-btn" style="display: none">تسجيل خروج</button>
    </header>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
      <h2>تسجيل الدخول</h2>
      <div id="error-msg"></div>
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" placeholder="example@mail.com" />
      <label>كلمة المرور</label>
      <input type="password" id="login-pass" placeholder="••••••••" />
      <button class="primary" id="login-btn">دخول</button>
    </div>

    <!-- الداش بورد -->
    <main id="dashboard">
      <div class="tabs">
        <button class="tab-btn active" data-tab="works">آخر الأعمال</button>
        <button class="tab-btn" data-tab="news">آخر الأخبار</button>
        <button class="tab-btn" data-tab="categories">التصنيفات</button>
      </div>

      <!-- تبويب آخر الأعمال -->
      <div class="panel active" id="panel-works">
        <div class="card">
          <h3 id="works-form-title">إضافة عمل جديد</h3>
          <form id="form-works">
            <label>الصورة</label>
            <input type="file" id="works-file" accept="image/*" required />
            <img id="works-preview" alt="معاينة" />

            <label>التصنيف</label>
            <select id="works-category" required></select>
            <small class="hint">لإضافة تصنيف جديد، روح لتبويب "التصنيفات"</small>

            <label>الوصف الأساسي</label>
            <input type="text" id="works-main" placeholder="مثال: جلسة تصوير زفاف" required />

            <label>الوصف الفرعي</label>
            <textarea id="works-sub" rows="2" placeholder="تفاصيل إضافية عن الصورة"></textarea>

            <div class="upload-status" id="works-upload-status"></div>

            <div class="btn-row">
              <button type="submit" class="primary" id="works-submit-btn">إضافة العمل</button>
              <button type="button" class="ghost" id="works-cancel-btn" style="display: none">إلغاء التعديل</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3>الأعمال المضافة</h3>
          <div id="works-list"><p class="empty-msg">جاري التحميل...</p></div>
        </div>
      </div>

      <!-- تبويب آخر الأخبار -->
      <div class="panel" id="panel-news">
        <div class="card">
          <h3 id="news-form-title">إضافة خبر جديد</h3>
          <form id="form-news">
            <label>الصورة الرئيسية (اختياري — صورة وحدة بس)</label>
            <input type="file" id="news-main-file" accept="image/*" />
            <div id="news-main-preview-wrap"></div>

            <label>الصور الفرعية (اختياري — تقدر تضيف أي عدد)</label>
            <input type="file" id="news-sub-files" accept="image/*" multiple />
            <div id="news-sub-preview" class="multi-preview"></div>

            <div class="upload-status" id="news-upload-status"></div>

            <label>الوصف الأساسي (اختياري)</label>
            <input type="text" id="news-main" placeholder="عنوان الخبر" />

            <label>الوصف الفرعي (اختياري)</label>
            <textarea id="news-sub" rows="2" placeholder="تفاصيل إضافية"></textarea>

            <div class="btn-row">
              <button type="submit" class="primary" id="news-submit-btn">نشر الخبر</button>
              <button type="button" class="ghost" id="news-cancel-btn" style="display: none">إلغاء التعديل</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3>الأخبار المنشورة</h3>
          <div id="news-list"><p class="empty-msg">جاري التحميل...</p></div>
        </div>
      </div>

      <!-- تبويب التصنيفات -->
      <div class="panel" id="panel-categories">
        <div class="card">
          <h3 id="category-form-title">إضافة تصنيف جديد</h3>
          <form id="form-category">
            <label>اسم التصنيف</label>
            <input type="text" id="category-name-input" placeholder="مثال: تصوير زفاف" required />
            <div class="btn-row">
              <button type="submit" class="primary" id="category-save-btn">إضافة تصنيف</button>
              <button type="button" class="ghost" id="category-cancel-btn" style="display: none">إلغاء التعديل</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3>التصنيفات الحالية</h3>
          <div id="categories-list"><p class="empty-msg">جاري التحميل...</p></div>
        </div>
      </div>
    </main>
    <script src="main.js" type="module"></script>
  </body>
</html>
